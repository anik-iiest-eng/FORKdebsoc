<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access — DebSoc IIEST Shibpur</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }

    .font-sans-body {
      font-family: 'Montserrat', sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  .auth-wrap {
    width: min(92vw, 560px);
    margin: 0 auto;
  }

  .auth-window {
    border: 2px solid #b51f35;
    background: #090909;
    box-shadow:
      7px 7px 0 #2d2d2d,
      10px 10px 0 rgba(181, 31, 53, 0.45);
  }

  .auth-titlebar {
    height: 34px;
    background: #b51f35;
    color: #f7e9e9;
    border-bottom: 2px solid #080808;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
  }

  .auth-titlebar-right {
    display: flex;
    gap: 4px;
  }

  .window-button {
    width: 16px;
    height: 16px;
    border: 1px solid #080808;
    background: #e5c9c9;
    color: #240007;
    display: grid;
    place-items: center;
    font-size: 10px;
    line-height: 1;
    font-weight: 700;
  }

  .auth-menubar {
    display: flex;
    gap: 18px;
    padding: 7px 10px;
    border-bottom: 1px solid #3b3b3b;
    background: #111;
    color: #cfcfcf;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  .auth-body {
    padding: 22px;
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 4px;
  }

  .auth-heading {
    margin-bottom: 18px;
  }

  .auth-kicker {
    display: inline-block;
    border: 1px solid #b51f35;
    padding: 3px 6px;
    margin-bottom: 9px;
    color: #db5b6e;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .auth-heading h1 {
    margin: 0;
    color: #f4eeee;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 500;
    letter-spacing: -0.04em;
  }

  .auth-heading p {
    margin-top: 6px;
    color: #8e8e8e;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.6;
  }

  .auth-alert {
    margin-bottom: 14px;
  }

  .auth-form {
    display: grid;
    gap: 13px;
  }

  .auth-field {
    display: grid;
    gap: 5px;
  }

  .auth-field label {
    color: #d2caca;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .auth-input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #454545;
    border-radius: 0;
    background: #151515;
    color: #eee;
    padding: 10px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .auth-input::placeholder {
    color: #505050;
  }

  .auth-input:focus {
    border-color: #c53a50;
    background: #1b1b1b;
  }

  .auth-button {
    width: 100%;
    border: 2px solid #b51f35;
    border-radius: 0;
    background: #b51f35;
    color: #fff2f2;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 3px 3px 0 #36000a;
  }

  .auth-button:hover {
    background: #c42b43;
  }

  .auth-button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #36000a;
  }

  .auth-link {
    color: #d45b6d;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .auth-link:hover {
    color: #f0a0ad;
  }

  .auth-bottom {
    margin-top: 17px;
    padding-top: 12px;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    color: #777;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
  }

  .auth-switch {
    border: 0;
    background: transparent;
    padding: 0;
    color: #d45b6d;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-decoration: underline;
    cursor: pointer;
  }

  .auth-reset {
    margin-top: 2px;
  }

  .auth-reset .auth-bottom {
    margin-top: 14px;
  }

  .otp-input {
    letter-spacing: 0.45em;
    text-align: center;
  }

  @media (max-width: 600px) {
    .auth-body {
      padding: 17px;
    }

    .auth-menubar {
      gap: 11px;
      font-size: 9px;
    }

    .auth-bottom {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>

</head>

<body
 class="min-h-screen bg-[#0B0C10] font-sans-body text-[#FAF7F2] flex flex-col selection:bg-[#DAA520] selection:text-[#800020]">
  

  <!-- Main Container -->
<main class="flex-1 px-4 py-14">
  <div class="auth-wrap">

    <div class="auth-window">

      <div class="auth-titlebar">
        <span>DEBSOC ACCESS</span>

        <div class="auth-titlebar-right">
          <span class="window-button">_</span>
          <span class="window-button">□</span>
          <span class="window-button">×</span>
        </div>
      </div>

      <div class="auth-menubar">
        <span>File</span>
        <span>Account</span>
        <span>Help</span>
      </div>

      <div class="auth-body">

        <div class="auth-heading">
          

          <h1 id="page-title">Create Account</h1>

          <p id="page-subtitle">
            Use your personal or institutional email address.
          </p>
        </div>

        <div id="auth-alert" class="auth-alert hidden"></div>

        <form id="register-form" class="auth-form">

          <div id="field-displayName" class="auth-field">
            <label for="reg-displayName">Full Name</label>
            <input
              type="text"
              id="reg-displayName"
              required
              placeholder="e.g. Anik Chakraborty"
              class="auth-input"
            >
          </div>

          <div id="field-username" class="auth-field">
            <label for="reg-username">DebSoc Handle</label>
            <input
              type="text"
              id="reg-username"
              required
              placeholder="e.g. anik_c"
              class="auth-input"
            >
          </div>

          <div class="auth-field">
            <label for="reg-email">Email Address</label>
            <input
              type="email"
              id="reg-email"
              required
              placeholder="you@example.com"
              class="auth-input"
            >
          </div>

          <div class="auth-field">
            <label for="reg-password">Password</label>
            <input
              type="password"
              id="reg-password"
              required
              placeholder="••••••••••••"
              class="auth-input"
            >
          </div>

          <div id="field-otp" class="auth-field hidden">
            <label for="reg-otp">6-Digit OTP</label>
            <input
              type="text"
              id="reg-otp"
              maxlength="6"
              placeholder="123456"
              class="auth-input otp-input"
            >
          </div>

          <a
            href="#"
            id="forgot-password-link"
            class="auth-link hidden"
          >
            Forgot password?
          </a>

          <button
            type="submit"
            id="submit-btn"
            class="auth-button"
          >
            Complete Registration
          </button>

        </form>

        <form id="forgot-password-form" class="auth-form hidden">

          <div id="forgot-password-alert" class="auth-alert hidden"></div>

          <div id="field-forgot-email" class="auth-field">
            <label for="forgot-email">Email Address</label>
            <input
              type="email"
              id="forgot-email"
              placeholder="you@example.com"
              class="auth-input"
            >
          </div>

          <div id="field-forgot-otp" class="auth-field hidden">
            <label for="forgot-otp">Verification Code</label>
            <input
              type="text"
              id="forgot-otp"
              maxlength="6"
              inputmode="numeric"
              placeholder="123456"
              class="auth-input otp-input"
            >
          </div>

          <div id="field-forgot-newpassword" class="auth-field hidden">
            <label for="forgot-newpassword">New Password</label>
            <input
              type="password"
              id="forgot-newpassword"
              placeholder="••••••••••••"
              class="auth-input"
            >
          </div>

          <button
            type="submit"
            id="forgot-submit-btn"
            class="auth-button"
          >
            Send Reset Code
          </button>

          <button
            type="button"
            id="back-to-login-btn"
            class="auth-switch"
          >
            ← Back to Sign In
          </button>

        </form>

        <div class="auth-bottom">
          <span id="toggle-text">
            Already registered on the circuit?
          </span>

          <button
            id="toggle-mode-btn"
            type="button"
            class="auth-switch"
          >
            Sign In
          </button>
        </div>

      </div>
    </div>

  </div>
</main>


  <script src="auth-page.js"></script>
  <script src="footer.js"></script>
  <script src="nav.js"></script>
</body>

</html>
