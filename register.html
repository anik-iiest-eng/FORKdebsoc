<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access — DebSoc IIEST Shibpur</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .font-sans-body { font-family: 'Montserrat', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-full bg-[#0B0C10] font-sans-body text-[#FAF7F2] flex flex-col justify-between selection:bg-[#DAA520] selection:text-[#800020]">

  <!-- Header / Navigation Bar matching DebSoc theme -->
  <nav class="w-full px-4 md:px-6 py-3 sticky top-0 z-50 backdrop-blur-md shadow-lg" 
       style="background: linear-gradient(135deg, rgba(128, 0, 32, 0.96) 0%, rgba(70, 0, 18, 0.96) 100%);">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 md:gap-3 group">
        <img src="debsoclogo.webp" alt="DebSoc Logo" class="h-9 md:h-10 w-auto object-contain transition-transform group-hover:scale-105">
        <div class="tracking-wide text-[#FAF7F2]">
          <div class="text-[13px] md:text-[15px] font-semibold uppercase leading-tight font-serif-title">
            THE DEBATING SOCIETY<br>
            <span class="text-[10px] md:text-[11px] font-normal opacity-90 tracking-widest font-sans-body">OF IIEST SHIBPUR</span>
          </div>
        </div>
      </a>

      <a href="index.html" class="text-xs font-mono-code text-[#FAF7F2]/80 hover:text-white px-3 py-1.5 rounded border border-white/20 hover:bg-white/10 transition">
        ← Return Home
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-10 relative overflow-hidden">
    <!-- Subtle Background Crest Watermark -->
    <img src="debsoclogo.webp" alt="" class="absolute opacity-5 w-[420px] pointer-events-none select-none filter grayscale mix-blend-screen">

    <div class="w-full max-w-md border border-[#DAA520]/25 bg-[#12141a]/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl relative z-10">
      
      <!-- Header -->
      <div class="mb-6">
        <span class="text-[10px] font-mono-code uppercase tracking-widest text-[#DAA520] border border-[#DAA520]/30 bg-[#DAA520]/10 px-2.5 py-0.5 rounded-full">
          Official Circuit Portal
        </span>
        <h1 id="page-title" class="text-2xl md:text-3xl font-bold tracking-wide text-white font-serif-title mt-3">
          Create Account
        </h1>
        <p id="page-subtitle" class="text-xs text-neutral-400 mt-1 font-light leading-relaxed">
          Use your personal or institutional email address.
        </p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="hidden p-3 mb-4 text-xs font-mono-code rounded-lg border"></div>

      <!-- Form -->
      <form id="register-form" class="space-y-4">
        
        <!-- Full Name -->
        <div id="field-displayName">
          <label class="block text-[11px] font-mono-code uppercase tracking-wider text-neutral-300 mb-1">Full Name</label>
          <input 
            type="text" 
            id="reg-displayName" 
            required 
            placeholder="e.g. Anik Chakraborty"
            class="w-full bg-[#181a22] border border-neutral-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#DAA520] transition placeholder-neutral-600" 
          />
        </div>

        <!-- Username -->
        <div id="field-username">
          <label class="block text-[11px] font-mono-code uppercase tracking-wider text-neutral-300 mb-1">DebSoc Handle</label>
          <input 
            type="text" 
            id="reg-username" 
            required 
            placeholder="e.g. anik_c"
            class="w-full bg-[#181a22] border border-neutral-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#DAA520] transition placeholder-neutral-600" 
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-[11px] font-mono-code uppercase tracking-wider text-neutral-300 mb-1">Email Address</label>
          <input 
            type="email" 
            id="reg-email" 
            required 
            placeholder="you@example.com"
            class="w-full bg-[#181a22] border border-neutral-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#DAA520] transition placeholder-neutral-600" 
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-[11px] font-mono-code uppercase tracking-wider text-neutral-300 mb-1">Password</label>
          <input 
            type="password" 
            id="reg-password" 
            required 
            placeholder="••••••••••••"
            class="w-full bg-[#181a22] border border-neutral-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#DAA520] transition placeholder-neutral-600" 
          />
        </div>
        <div id="field-otp" class="hidden">
  <label for="reg-otp" class="block text-sm font-medium">Enter 6-Digit OTP</label>
  <input 
    type="text" 
    id="reg-otp" 
    maxlength="6" 
    placeholder="123456" 
    class="w-full p-2 mt-1 rounded border text-center tracking-widest text-lg"
  />
</div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submit-btn"
          class="w-full mt-3 py-2.5 rounded-lg text-xs font-semibold uppercase tracking-wider shadow-md transition-all duration-200 active:scale-95"
          style="background: #DAA520; color: #800020;"
        >
          Complete Registration
        </button>
      </form>

      <!-- Toggle Mode -->
      <div class="mt-6 pt-4 border-t border-neutral-800/80 text-center text-xs text-neutral-400 font-sans-body">
        <span id="toggle-text">Already registered on the circuit?</span>
        <button id="toggle-mode-btn" type="button" class="text-[#DAA520] hover:underline font-semibold ml-1">
          Sign In
        </button>
      </div>

    </div>
  </main>

  <!-- Footer matching DebSoc theme -->
  <footer class="border-t border-[#DAA520]/20 px-6 py-4 text-center text-xs font-sans-body text-neutral-400" style="background-color: #140006;">
    © 2026 The Debating Society, IIEST Shibpur. All rights reserved.
  </footer>

  <script src="auth-page.js"></script>
</body>
</html>
