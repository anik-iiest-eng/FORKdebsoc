<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">
  <title>History | DebSoc IIEST Shibpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="history-masthead">
    <div class="history-masthead-inner">
      <p class="history-kicker">DEBSOC / IIEST SHIBPUR / ARCHIVE 001</p>
      <h1>History<br><span>in session.</span></h1>
      <p class="history-intro">A living record of the debates, delegations, people and moments that shaped our society.</p>
      <div class="history-index"><span>DEBATE</span><i></i><span>DISCUSS</span><i></i><span>REMEMBER</span></div>
    </div>
    <div class="masthead-mark" aria-hidden="true">D</div>
  </div>

  <main id="feed" class="history-feed" aria-live="polite">
    <div class="history-state">Loading the archive…</div>
  </main>

  <script>
    const API_BASE = "https://forkdebsoc.onrender.com/api";
    const DATE_FORMAT = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "long", year: "numeric" });
    // poster = Oasis · crusader = orange halftone collage · circles = becon duotone · collage = Inferno (colour)
    const VARIANTS = ["poster", "crusader", "circles", "collage"];

    const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const formatDate = (value) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : DATE_FORMAT.format(date);
    };

    const eventImages = (event) => {
      const images = [event.coverImage, ...(Array.isArray(event.images) ? event.images : [])]
        .filter((image) => typeof image === "string" && image.trim());
      return [...new Set(images)].slice(0, 7);
    };

    const imageMarkup = (src, alt, className = "") => {
      const onError = className === "cover-image"
        ? "const backup=this.closest('.entry-art').querySelector('.event-thumb img');if(backup){this.src=backup.src;backup.closest('figure').remove()}else{this.closest('figure').classList.add('image-unavailable');this.remove()}"
        : "this.closest('figure').remove()";
      return `<img class="${className}" src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="${onError}">`;
    };

    const renderImages = (images, title) => images.length
      ? `<div class="event-gallery" aria-label="More photos from ${escapeHTML(title)}">
          ${images.map((src, index) => `<figure class="event-thumb">${imageMarkup(src, `${title}, photo ${index + 2}`)}</figure>`).join("")}
        </div>`
      : "";

    const renderAwards = (awards) => {
      if (!awards.length) return "";
      return `
        <section class="event-awards" aria-label="Awards">
          <p class="section-label">Recognitions <span>${String(awards.length).padStart(2, "0")}</span></p>
          <div class="award-list">
            ${awards.map((award) => {
              const user = award.user || {};
              const name = user.displayName || "Verified Awardee";
              const content = `<span class="award-mark" aria-hidden="true">✳</span>
                <span><b>${escapeHTML(award.position || "Recognition")}</b><small>${escapeHTML(name)}</small></span>`;
              return user.username
                ? `<a class="award-item" href="profile.html?u=${encodeURIComponent(user.username)}">${content}</a>`
                : `<div class="award-item">${content}</div>`;
            }).join("")}
          </div>
        </section>`;
    };

    const renderEvent = (event, index) => {
      const title = event.title || "Untitled event";
      const date = formatDate(event.eventDate);
      const location = event.location || "IIEST Shibpur";
      const images = eventImages(event);
      const cover = images[0];
      const awards = Array.isArray(event.achievements) ? event.achievements : [];
      const awardCount = Number.isInteger(event.awardCount) ? event.awardCount : awards.length;
      const description = event.description || "";
      const year = date ? new Date(event.eventDate).getFullYear() : "ARCHIVE";
      const variant = VARIANTS[index % VARIANTS.length];

      return `
        <article class="history-entry history-entry--${variant}">
          <div class="entry-layout">
            <header class="entry-head">
              <p class="entry-meta"><span>${escapeHTML(date || "Undated")}</span><i></i><span>${escapeHTML(location)}</span></p>
              <h2>${escapeHTML(title)}</h2>
            </header>
            <div class="entry-art">
              <figure class="entry-cover ${cover ? "" : "entry-cover--empty"}">
                ${cover ? imageMarkup(cover, title, "cover-image") : `<span class="cover-placeholder" aria-hidden="true">DEBSOC<br>ARCHIVE</span>`}
                <span class="cover-caption">${String(index + 1).padStart(2, "0")} / FIELD NOTES</span>
              </figure>
              ${renderImages(images.slice(1), title)}
            </div>
            <div class="entry-copy">
              ${description ? `<p class="entry-description">${escapeHTML(description)}</p>` : ""}
              ${awardCount ? `<p class="award-count"><b>${escapeHTML(awardCount)}</b> ${awardCount === 1 ? "award" : "awards"} recorded</p>` : ""}
              ${renderAwards(awards)}
              <div class="entry-endmark" aria-hidden="true">DS / ${String(year)}</div>
            </div>
          </div>
        </article>`;
    };

    const renderHistory = (events) => {
      const feed = document.getElementById("feed");
      if (!events.length) {
        feed.innerHTML = `<div class="history-state">Nothing in the archive yet.<small>Check back after the next session.</small></div>`;
        return;
      }
      const sorted = [...events].sort((a, b) => new Date(b.eventDate) - new Date(a.eventDate));
      feed.innerHTML = sorted.map(renderEvent).join("");
    };

    const loadHistory = async () => {
      const feed = document.getElementById("feed");
      feed.innerHTML = `<div class="history-state">Loading the archive…</div>`;
      try {
        const response = await fetch(`${API_BASE}/history`);
        if (!response.ok) throw new Error(`Archive request failed (${response.status}).`);
        const events = await response.json();
        if (!Array.isArray(events)) throw new Error("The archive returned an invalid response.");
        renderHistory(events);
      } catch (error) {
        console.error("History fetch failed:", error);
        feed.innerHTML = `<div class="history-state">The archive could not be loaded.<small>${escapeHTML(error.message)}</small><button type="button">Try again</button></div>`;
        feed.querySelector("button").addEventListener("click", loadHistory);
      }
    };

    document.addEventListener("DOMContentLoaded", loadHistory);
  </script>
  <script src="footer.js"></script>
  <script src="nav.js"></script>
</body>
</html>
