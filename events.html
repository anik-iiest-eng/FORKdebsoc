<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events & Tournaments — Debating Society IIEST Shibpur</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .font-sans-body { font-family: 'Montserrat', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
  <link rel="stylesheet" href="editorial-theme.css">
</head>
<body class="editorial-page h-full overflow-auto bg-[#0B0C10] font-sans-body text-[#FAF7F2] flex flex-col justify-between selection:bg-[#DAA520] selection:text-[#800020]">

  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden px-5 py-3 rounded-lg text-xs font-mono-code shadow-2xl border transition-all duration-300 transform"></div>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-14">
    
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 pb-6 border-b border-neutral-800 gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-[#DAA520]/30 bg-[#DAA520]/10 text-[#DAA520] text-xs font-mono-code mb-3">
          <span class="w-2 h-2 rounded-full bg-[#DAA520] animate-pulse"></span>
          OFFICIAL PARLIAMENTARY CIRCUIT
        </div>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-wide text-white font-serif-title">
          Tournaments & Sessions
        </h1>
      </div>
      <p class="text-xs md:text-sm text-neutral-400 max-w-md font-light leading-relaxed">
        Live debate registrations, Asian Parliamentary fixtures, and Model United Nations conclaves hosted by DebSoc IIEST Shibpur.
      </p>
    </div>

    <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
      
      <div class="border border-neutral-800/80 bg-[#12141a] rounded-xl p-6 h-80 animate-pulse flex flex-col justify-between">
        <div class="h-40 bg-neutral-800/50 rounded-lg mb-4"></div>
        <div class="space-y-2">
          <div class="h-4 bg-neutral-800/80 rounded w-3/4"></div>
          <div class="h-3 bg-neutral-800/50 rounded w-full"></div>
        </div>
      </div>
      <div class="border border-neutral-800/80 bg-[#12141a] rounded-xl p-6 h-80 animate-pulse flex flex-col justify-between">
        <div class="h-40 bg-neutral-800/50 rounded-lg mb-4"></div>
        <div class="space-y-2">
          <div class="h-4 bg-neutral-800/80 rounded w-3/4"></div>
          <div class="h-3 bg-neutral-800/50 rounded w-full"></div>
        </div>
      </div>
      <div class="border border-neutral-800/80 bg-[#12141a] rounded-xl p-6 h-80 animate-pulse flex flex-col justify-between">
        <div class="h-40 bg-neutral-800/50 rounded-lg mb-4"></div>
        <div class="space-y-2">
          <div class="h-4 bg-neutral-800/80 rounded w-3/4"></div>
          <div class="h-3 bg-neutral-800/50 rounded w-full"></div>
        </div>
      </div>

    </div>
  </main>



  <script>
    const API_BASE = "https://forkdebsoc.onrender.com/api";
    // For Vercel deployment with same-origin API routing:
    // const API_BASE = "/api";
    localStorage.removeItem("debsoc_token");
    let csrfToken;

    async function apiFetch(url, options = {}) {
      const method = (options.method || "GET").toUpperCase();
      const headers = new Headers(options.headers || {});
      if (method !== "GET" && method !== "HEAD" && method !== "OPTIONS") {
        if (!csrfToken) {
          const csrfResponse = await fetch(`${API_BASE}/csrf-token`, { credentials: "include" });
          const csrfData = await csrfResponse.json();
          csrfToken = csrfData.csrfToken;
        }
        headers.set("X-CSRF-Token", csrfToken);
      }
      return fetch(url, { ...options, credentials: "include", headers });
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
    }

    document.addEventListener("DOMContentLoaded", () => {
      syncNavAuth();
      fetchTournaments();
    });

    // 1. Sync User Session in Navbar
    function syncNavAuth() {
      const desktopNav = document.getElementById("nav-auth-container");
      const mobileNav = document.getElementById("mobile-auth-container");
      const userRaw = localStorage.getItem("debsoc_user");

      if (userRaw) {
        try {
          const user = JSON.parse(userRaw);
          const userBadgeHtml = `
            <div class="flex items-center gap-3">
              <span class="text-xs font-mono-code text-[#DAA520] bg-[#DAA520]/10 border border-[#DAA520]/30 px-2.5 py-1 rounded-full">
                <a href="profile.html?u=${encodeURIComponent(user.username)}" class="hover:text-white">@${user.username}</a>
              </span>
              <a href="profile.html?u=${encodeURIComponent(user.username)}" class="text-xs text-[#DAA520] hover:text-white">Profile</a>
              <button onclick="handleLogout()" class="text-xs font-medium px-3 py-1.5 rounded-md text-white/80 hover:text-white hover:bg-white/10 transition-all border border-white/20">
                Sign Out
              </button>
            </div>
          `;
          if (desktopNav) desktopNav.innerHTML = userBadgeHtml;
          if (mobileNav) {
            mobileNav.innerHTML = `
              <div class="flex items-center justify-between px-4 py-2 bg-white/5 rounded-lg mx-4">
                <a href="profile.html?u=${encodeURIComponent(user.username)}" class="text-xs font-mono-code text-[#DAA520]">@${user.username}</a>
                <a href="profile.html?u=${encodeURIComponent(user.username)}" class="text-xs text-[#DAA520]">My Profile</a>
                <button onclick="handleLogout()" class="text-xs text-red-300 font-semibold uppercase">Sign Out</button>
              </div>
            `;
          }
          return;
        } catch (e) {
          localStorage.removeItem("debsoc_user");
        }
      }
    }

    async function handleLogout() {
      await apiFetch(`${API_BASE}/auth/logout`, { method: "POST" });
      localStorage.removeItem("debsoc_user");
      window.location.reload();
    }

    // 2. Fetch Active Tournaments
    async function fetchTournaments() {
      const grid = document.getElementById("events-grid");

      try {
        const res = await fetch(`${API_BASE}/events`);
        if (!res.ok) throw new Error("Could not retrieve tournaments.");

        const events = await res.json();

        if (!Array.isArray(events) || events.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full border border-neutral-800 bg-[#12141a] p-12 rounded-xl text-center">
              <p class="text-base text-neutral-300 font-serif-title">No upcoming tournaments currently scheduled.</p>
              <p class="text-xs text-neutral-500 font-mono-code mt-2">Check back soon for fresher debates & flagship conclaves.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = events.map(ev => renderEventCard(ev)).join("");
        bindRegistrationHandlers();
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full border border-red-900/40 bg-red-950/20 p-8 rounded-xl text-center">
            <p class="text-sm text-red-300 font-mono-code">${err.message || "Failed to load tournament feed."}</p>
          </div>
        `;
      }
    }

    // 3. Render Card HTML
    function renderEventCard(ev) {
      const dateFormatted = new Date(ev.eventDate).toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });

      const deadline = new Date(ev.registrationDeadline);
      const isExpired = new Date() > deadline;

      return `
        <div class="border border-neutral-800/90 bg-[#12141a] hover:border-[#DAA520]/50 rounded-xl overflow-hidden flex flex-col justify-between transition-all duration-300 group shadow-lg">
          <div>
            <div class="relative h-44 w-full overflow-hidden bg-neutral-900">
              <img 
                src="${ev.coverImage || 'https://images.unsplash.com/photo-1544531585-9847b68c8c86'}" 
                alt="${ev.title}" 
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-85"
              />
              <div class="absolute top-3 left-3 bg-[#0B0C10]/80 backdrop-blur-md border border-[#DAA520]/30 px-2.5 py-1 rounded text-[10px] font-mono-code text-[#DAA520]">
                ${ev.location || "IIEST Campus"}
              </div>
            </div>

            <div class="p-5">
              <div class="text-[11px] font-mono-code text-neutral-400 mb-2">
                DATE: ${dateFormatted}
              </div>
              <h3 class="text-lg font-bold text-white font-serif-title mb-2 group-hover:text-[#DAA520] transition-colors">
                ${ev.title}
              </h3>
              <p class="text-xs text-neutral-400 font-light line-clamp-3 leading-relaxed">
                ${ev.description}
              </p>
            </div>
          </div>

          <div class="p-5 pt-0">
            <div class="pt-4 border-t border-neutral-800/80 flex items-center justify-between gap-2">
              <span class="text-[10px] font-mono-code ${isExpired ? 'text-red-400' : 'text-neutral-500'}">
                ${isExpired ? 'Closed' : 'Deadline: ' + deadline.toLocaleDateString()}
              </span>

              <button 
                data-id="${ev.id}" 
                ${isExpired ? 'disabled' : ''} 
                class="register-btn text-xs font-semibold px-4 py-2 rounded-lg transition-all shadow-sm ${
                  isExpired 
                    ? 'bg-neutral-800 text-neutral-500 cursor-not-allowed' 
                    : 'bg-[#DAA520] hover:bg-[#c49219] text-[#800020] active:scale-95'
                }"
              >
                Register
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // 4. Attach API Registration Click
    function bindRegistrationHandlers() {
      document.querySelectorAll(".register-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const eventId = e.currentTarget.getAttribute("data-id");
          if (!localStorage.getItem("debsoc_user")) {
            triggerToast("Please login with your IIEST student email to register.", "error");
            setTimeout(() => { window.location.href = "register.html"; }, 1200);
            return;
          }

          const button = e.currentTarget;
          button.disabled = true;
          button.innerText = "Registering...";

          try {
            const res = await apiFetch(`${API_BASE}/events/${eventId}/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" }
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Registration failed.");

            triggerToast("Registration confirmed! Check your participant record.", "success");
            button.innerText = "Registered ✓";
            button.className = "text-xs font-semibold px-4 py-2 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-800/60 cursor-default";
          } catch (err) {
            triggerToast(err.message, "error");
            button.disabled = false;
            button.innerText = "Register";
          }
        });
      });
    }

    // 5. Toast Notifications
    function triggerToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      if (!toast) return;

      toast.innerText = msg;
      toast.className = `fixed bottom-6 right-6 z-50 px-5 py-3 rounded-lg text-xs font-mono-code border shadow-2xl transition-all duration-300 ${
        type === "error" 
          ? "bg-[#2b0c10] border-red-800 text-red-200" 
          : "bg-[#0b2416] border-emerald-700 text-emerald-200"
      }`;

      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3500);
    }
  </script>
  <script src="footer.js"></script>
  <script src="nav.js"></script>
</body>
</html>
